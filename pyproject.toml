[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chonky-py"
version = "0.1.0"
description = "Streamlit application for document loading, NLP, embeddings, and vector search"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Terry Eppler"}]
license = "MIT"
license-files = ["LICENSE.txt"]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/is-leeroy-jenkins/chonky"
Documentation = "https://is-leeroy-jenkins.github.io/chonky/"
Issues = "https://github.com/is-leeroy-jenkins/chonky/issues"

[project.scripts]
chonky = "chonky.cli:main"
chonky-desktop = "chonky.cli:desktop"

[project.optional-dependencies]
desktop = ["pywebview>=5.0; sys_platform == 'win32'"]

[tool.setuptools]
packages = ["chonky"]
package-dir = {chonky = "."}
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-runtime.txt"]}

[tool.setuptools.package-data]
chonky = ["resources/images/**/*.png", "resources/images/**/*.ico", ".streamlit/config.toml"]
